<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#9b7bc7" />
<title>Happy Anniversary 💕</title>

<!-- A single handwriting-ish + serif pairing. Falls back gracefully if offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --rose:   #9b7bc7;
    --rose-d: #6f5099;
    --blush:  #ece6f6;
    --cream:  #faf7ff;
    --ink:    #443a52;
    --gold:   #c79a52;
    --paper:  #fffdfb;
    --shadow: rgba(80, 55, 120, 0.18);
    --serif:  "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --script: "Dancing Script", "Segoe Script", cursive;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--serif);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #f4ecfb 0%, transparent 60%),
      linear-gradient(160deg, #f3ecfb 0%, #ece2f6 40%, #e6daf4 100%);
    min-height: 100svh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Floating hearts background layer */
  #hearts {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bg-heart {
    position: absolute; bottom: -40px;
    font-size: 1.2rem; opacity: 0;
    animation: rise linear infinite;
    will-change: transform, opacity;
  }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg) scale(.8); opacity: 0; }
    10%  { opacity: .55; }
    90%  { opacity: .35; }
    100% { transform: translateY(-110svh) rotate(40deg) scale(1.1); opacity: 0; }
  }

  /* ---------- ENVELOPE ---------- */
  #stage {
    position: relative; z-index: 1;
    min-height: 100svh;
    display: grid; place-items: center;
    padding: 24px;
  }

  .envelope-wrap {
    text-align: center;
    animation: floatIn .9s ease both;
  }
  @keyframes floatIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .tap-hint {
    font-family: var(--script);
    font-size: 1.5rem; color: var(--rose-d);
    margin-bottom: 18px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  .envelope {
    --w: min(86vw, 360px);
    width: var(--w); height: calc(var(--w) * 0.66);
    position: relative; margin: 0 auto;
    cursor: pointer; user-select: none;
    filter: drop-shadow(0 18px 30px var(--shadow));
    transition: transform .4s ease;
  }
  .envelope:active { transform: scale(.98); }

  .env-body {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #d9c7ee, #c2a8e2);
    border-radius: 10px;
  }
  /* the two side triangles + bottom for depth */
  .env-pocket {
    position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
  }
  .env-pocket::before { /* bottom flap */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; top: 0;
    background:
      linear-gradient(to top right, #c9b1e8 49.5%, transparent 50%) left bottom / 50% 100% no-repeat,
      linear-gradient(to top left,  #c9b1e8 49.5%, transparent 50%) right bottom / 50% 100% no-repeat,
      linear-gradient(#d4bfee, #d4bfee) center bottom / 100% 60% no-repeat;
  }

  /* the letter peeking/sliding out */
  .letter-peek {
    position: absolute; left: 6%; right: 6%; bottom: 8%;
    height: 78%; background: var(--paper);
    border-radius: 6px 6px 2px 2px;
    box-shadow: 0 6px 14px rgba(0,0,0,.12);
    z-index: 2; transition: transform .7s cubic-bezier(.2,.8,.2,1);
  }

  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    background: linear-gradient(135deg, #c2a8e2, #ad8fd6);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center; z-index: 4;
    transition: transform .6s ease, z-index 0s .3s;
    border-radius: 10px 10px 0 0;
  }
  .seal {
    position: absolute; top: 34%; left: 50%; transform: translate(-50%,-50%);
    width: 58px; height: 58px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d8a85f, var(--gold));
    box-shadow: 0 4px 10px rgba(120,80,20,.45), inset 0 -3px 6px rgba(0,0,0,.25);
    z-index: 5; display: grid; place-items: center;
    font-family: var(--serif); font-weight: 600; font-size: 1.6rem; color: #5a3c12;
    transition: opacity .35s ease, transform .35s ease;
  }

  /* opened state */
  .envelope.open .env-flap   { transform: rotateX(180deg); z-index: 1; }
  .envelope.open .seal       { opacity: 0; transform: translate(-50%,-50%) scale(.4); }
  .envelope.open .letter-peek{ transform: translateY(-115%) scale(1.02); }

  /* ---------- LETTER + CONTENT (revealed after open) ---------- */
  #content {
    position: relative; z-index: 1;
    max-width: 640px; margin: 0 auto;
    padding: 0 20px 90px;
    opacity: 0; pointer-events: none;
    transition: opacity .8s ease;
  }
  #content.show { opacity: 1; pointer-events: auto; }

  .letter {
    background: var(--paper);
    border: 1px solid #f0e2d8;
    border-radius: 14px;
    padding: 34px 28px;
    box-shadow: 0 16px 40px var(--shadow);
    margin-top: 8px;
    position: relative;
  }
  .letter::before {
    content: "💌"; position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 2.4rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,.15));
  }
  .letter h1 {
    font-family: var(--script); font-weight: 700;
    font-size: clamp(2rem, 8vw, 3rem); color: var(--rose-d);
    text-align: center; line-height: 1.05; margin-bottom: 6px;
  }
  .letter .sub {
    text-align: center; font-style: italic; color: var(--rose);
    font-size: 1.15rem; margin-bottom: 22px;
  }
  .letter .greeting {
    font-family: var(--script); font-size: 1.6rem; color: var(--ink); margin-bottom: 10px;
  }
  .letter p.body {
    font-size: 1.25rem; line-height: 1.7; white-space: pre-line; color: var(--ink);
  }
  .letter .sign {
    font-family: var(--script); font-size: 1.5rem; color: var(--rose-d);
    text-align: right; margin-top: 18px;
  }

  .section-title {
    text-align: center; font-family: var(--script);
    font-size: clamp(1.8rem, 7vw, 2.4rem); color: var(--rose-d);
    margin: 54px 0 26px;
  }

  /* timeline */
  .timeline {
    position: relative;
    /* responsive widths; bar + content are derived from the date column so the
       gap between the date and the marker is always guaranteed (no overlap) */
    --date-w: clamp(84px, 22vw, 150px);   /* width of the date column on the left */
    --bar-x: calc(var(--date-w) + 18px);  /* the vertical bar's distance from the left */
    --content-x: calc(var(--bar-x) + 22px); /* where the cards begin */
    padding-left: var(--content-x);
  }
  .timeline::before {
    content: ""; position: absolute; left: var(--bar-x); top: 6px; bottom: 6px;
    width: 3px; background: linear-gradient(var(--rose), #d9c7ee);
    border-radius: 2px;
  }
  .memory {
    position: relative; margin-bottom: 30px;
    background: var(--paper); border-radius: 14px;
    box-shadow: 0 10px 26px var(--shadow);
    opacity: 0; transform: translateY(26px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .memory.in { opacity: 1; transform: none; }
  .memory::before {
    content: "♥"; position: absolute;
    left: calc(var(--bar-x) - var(--content-x) + 1.5px - 11px); top: 18px;
    color: var(--rose); font-size: 1rem;
    background: var(--cream); border-radius: 50%; width: 22px; height: 22px;
    display: grid; place-items: center; box-shadow: 0 0 0 3px #e6daf4;
    z-index: 3;
  }

  /* the date, sitting in the left column beside the spine */
  .memory .m-date {
    position: absolute; left: calc(-1 * var(--content-x)); width: var(--date-w); top: 13px;
    text-align: right; line-height: 1.25; overflow-wrap: break-word;
    font-size: clamp(.8rem, 3.3vw, .95rem); letter-spacing: .01em; color: var(--gold);
    font-weight: 700; text-transform: uppercase;
    opacity: 0; transform: translateX(-12px);
    transition: opacity .6s ease .15s, transform .6s cubic-bezier(.2,.8,.2,1) .15s;
  }
  .memory.in .m-date { opacity: 1; transform: none; }
  .memory.note .m-date { top: 4px; }
  /* trips get a pin marker instead of a heart */
  .memory.trip::before { content: "📍"; font-size: .85rem; }

  /* text-only moment: a slim note, no card chrome (great for the early days) */
  .memory.note { background: transparent; box-shadow: none; }
  .memory.note::before { top: 6px; }
  .memory.note .m-text { padding: 4px 2px 8px; }
  .memory.note .m-title { font-size: 1.4rem; }

  /* swipeable photo strip for trips */
  .gallery-wrap { position: relative; border-radius: 14px 14px 0 0; overflow: hidden; }
  .gallery {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery .shot {
    flex: 0 0 100%; scroll-snap-align: center;
    aspect-ratio: 4/3; background: #ece6f6;
  }
  .gallery .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery .shot.ph {                       /* shown when a photo file is missing */
    display: grid; place-items: center; gap: 4px; text-align: center;
    background: linear-gradient(135deg, #efe7f8, #e3d5f2); color: var(--rose-d);
    font-size: .9rem; padding: 12px;
  }
  .gallery .shot.ph .ph-ic { font-size: 1.9rem; }

  /* arrow buttons (for mouse / desktop; swipe still works on touch) */
  .nav {
    position: absolute; top: calc(50% - 17px); width: 34px; height: 34px;
    border: none; border-radius: 50%; cursor: pointer; z-index: 4;
    background: rgba(255,255,255,.85); color: var(--rose-d); font-size: 1.3rem; line-height: 1;
    box-shadow: 0 2px 8px var(--shadow); display: grid; place-items: center;
    opacity: 1; transition: opacity .3s ease, transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .nav.prev { left: 8px; } .nav.next { right: 8px; }
  .nav:active { transform: scale(.9); }
  /* hidden at the ends of the strip — fades + slides away */
  .nav.hide { opacity: 0; pointer-events: none; }
  .nav.prev.hide { transform: translateX(-12px) scale(.6); }
  .nav.next.hide { transform: translateX(12px) scale(.6); }

  .dots { display: flex; gap: 6px; justify-content: center; padding: 10px 0 2px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: #d9c7ee; transition: background .25s ease, transform .25s ease; }
  .dots span.on { background: var(--rose); transform: scale(1.35); }

  .memory .m-text { padding: 16px 18px 20px; }
  .memory .m-title { font-family: var(--script); font-size: 1.6rem; color: var(--rose-d); line-height: 1.1; margin: 2px 0 4px; }
  .memory .m-place { font-size: 1rem; color: var(--rose); font-weight: 600; margin-bottom: 6px; }
  .memory .m-body { font-size: 1.12rem; line-height: 1.55; }

  footer {
    text-align: center; margin-top: 56px;
  }
  footer .big {
    font-family: var(--script); font-size: clamp(1.8rem, 7vw, 2.4rem); color: var(--rose-d);
  }
  footer .counter {
    margin-top: 10px; font-size: 1.2rem; color: var(--rose);
  }
  footer .counter b { font-size: 1.6rem; }

  /* music button */
  #music {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: var(--rose); color: #fff; font-size: 1.4rem;
    box-shadow: 0 8px 20px var(--shadow); cursor: pointer;
    display: none; place-items: center;
    transition: transform .2s ease, background .2s ease;
  }
  #music.show { display: grid; }
  #music:active { transform: scale(.92); }
  #music.playing { background: var(--rose-d); animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* confetti canvas */
  #confetti { position: fixed; inset: 0; z-index: 15; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .001s !important; scroll-behavior: auto; }
    .bg-heart { display: none; }
  }
</style>
</head>
<body>

<div id="hearts" aria-hidden="true"></div>

<!-- Envelope -->
<main id="stage">
  <div class="envelope-wrap">
    <div class="tap-hint">tap to open ♥</div>
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open your card">
      <div class="env-body"></div>
      <div class="letter-peek"></div>
      <div class="env-pocket"></div>
      <div class="env-flap"></div>
      <div class="seal" id="seal">2</div>
    </div>
  </div>
</main>

<!-- The card content, revealed after the envelope opens -->
<section id="content" aria-hidden="true">
  <article class="letter">
    <h1 id="headline"></h1>
    <p class="sub" id="subhead"></p>
    <p class="greeting" id="greeting"></p>
    <p class="body" id="letterBody"></p>
    <p class="sign" id="sign"></p>
  </article>

  <h2 class="section-title">our two years ♡</h2>
  <div class="timeline" id="timeline"></div>

  <footer>
    <div class="big">Happy 2 Years 💞</div>
    <div class="counter" id="counter"></div>
  </footer>
</section>

<button id="music" aria-label="Play music" title="Play our song">♪</button>
<audio id="audio" loop preload="auto"></audio>
<canvas id="confetti" aria-hidden="true"></canvas>

/* =======================================================================

/* ---- floating background hearts ---- */
(function makeHearts() {
  const layer = document.getElementById("hearts");
  const glyphs = ["♥", "💕", "🤍", "💗"];
  const N = 14;
  for (let i = 0; i < N; i++) {
    const h = document.createElement("span");
    h.className = "bg-heart";
    h.textContent = glyphs[i % glyphs.length];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (0.9 + Math.random() * 1.6) + "rem";
    h.style.animationDuration = (9 + Math.random() * 10) + "s";
    h.style.animationDelay = (-Math.random() * 12) + "s";
    layer.appendChild(h);
  }
})();

/* ---- populate the letter ---- */
document.getElementById("headline").textContent  = CONFIG.headline;
document.getElementById("subhead").textContent   = CONFIG.subhead;
document.getElementById("greeting").textContent  = "Hé lu " + CONFIG.herName + ",";
document.getElementById("letterBody").textContent = CONFIG.letterText;
document.getElementById("sign").textContent       = "Yours.\n" + CONFIG.fromName;

/* ---- build the timeline ---- */
(function buildTimeline() {
  const tl = document.getElementById("timeline");
  // show months as 3-letter abbreviations (December -> Dec) while CONFIG keeps full names
  const MON = { january:"Jan", february:"Feb", march:"Mar", april:"Apr", may:"May", june:"Jun",
                july:"Jul", august:"Aug", september:"Sep", october:"Oct", november:"Nov", december:"Dec" };
  const abbrevDate = s => (s || "").replace(
    /january|february|march|april|may|june|july|august|september|october|november|december/gi,
    m => MON[m.toLowerCase()]);
  CONFIG.memories.forEach(m => {
    // accepts photos: [...] (preferred) or a single photo: "..." (still works)
    const photos = (m.photos && m.photos.length) ? m.photos : (m.photo ? [m.photo] : []);
    const isTrip = !!m.place;
    const card = document.createElement("div");
    card.className = "memory" + (photos.length ? "" : " note") + (isTrip ? " trip" : "");

    let media = "";
    if (photos.length) {
      const shots = photos.map(src =>
        `<div class="shot"><img src="${src}" alt="${m.title || ""}" loading="lazy"></div>`).join("");
      const arrows = photos.length > 1
        ? `<button class="nav prev" aria-label="Previous photo">‹</button>
           <button class="nav next" aria-label="Next photo">›</button>`
        : "";
      const dots = photos.length > 1
        ? `<div class="dots">${photos.map((_, i) => `<span class="${i === 0 ? "on" : ""}"></span>`).join("")}</div>`
        : "";
      media = `<div class="gallery-wrap"><div class="gallery">${shots}</div>${arrows}</div>${dots}`;
    }

    card.innerHTML = `
      <div class="m-date">${abbrevDate(m.date)}</div>
      ${media}
      <div class="m-text">
        <div class="m-title">${m.title || ""}</div>
        ${m.place ? `<div class="m-place">${m.place}</div>` : ""}
        <div class="m-body">${m.text || ""}</div>
      </div>`;
    tl.appendChild(card);
  });

  // missing photo files -> show a soft "photo coming soon" placeholder instead of a blank
  function markMissing(img) {
    const shot = img.closest(".shot");
    if (!shot) return;
    shot.classList.add("ph");
    shot.innerHTML = '<span class="ph-ic">🖼️</span><span>photo coming soon</span>';
  }
  document.querySelectorAll(".gallery .shot img").forEach(img => {
    if (img.complete && img.naturalWidth === 0) markMissing(img);
    else img.addEventListener("error", () => markMissing(img));
  });

  // wire each photo strip: arrows + dot indicator
  document.querySelectorAll(".gallery").forEach(g => {
    const wrap = g.closest(".gallery-wrap");
    const dots = wrap && wrap.parentElement.querySelector(".dots");
    const prev = wrap && wrap.querySelector(".nav.prev");
    const next = wrap && wrap.querySelector(".nav.next");
    if (prev) prev.addEventListener("click", () => g.scrollBy({ left: -g.clientWidth, behavior: "smooth" }));
    if (next) next.addEventListener("click", () => g.scrollBy({ left:  g.clientWidth, behavior: "smooth" }));

    function update() {
      // hide the left arrow at the first photo, the right arrow at the last
      const atStart = g.scrollLeft <= 2;
      const atEnd = g.scrollLeft >= g.scrollWidth - g.clientWidth - 2;
      if (prev) prev.classList.toggle("hide", atStart);
      if (next) next.classList.toggle("hide", atEnd);
      if (dots) {
        const idx = Math.round(g.scrollLeft / g.clientWidth);
        dots.querySelectorAll("span").forEach((d, i) => d.classList.toggle("on", i === idx));
      }
    }
    g.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    update();   // initial state: left arrow starts hidden
  });
})();

/* ---- days-together counter ---- */
(function counter() {
  const start = new Date(CONFIG.anniversaryDate);
  if (isNaN(start)) return;
  const days = Math.max(0, Math.floor((Date.now() - start) / 86400000));
  document.getElementById("counter").innerHTML =
    `That's <b>${days.toLocaleString()}</b> days of you and me 💗`;
})();

/* ---- reveal timeline cards on scroll ---- */
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: 0.15 });
document.querySelectorAll(".memory").forEach(el => io.observe(el));

/* ---- music: starts when she opens the card; button is for pause/resume ---- */
const audio = document.getElementById("audio");
const musicBtn = document.getElementById("music");
let musicReady = false;
audio.src = CONFIG.songFile;
// once a real song is loadable, make sure the button is reachable after opening
audio.addEventListener("canplay", () => { musicReady = true; if (opened) musicBtn.classList.add("show"); });

function setPlaying(on) {
  musicBtn.classList.toggle("playing", on);
  musicBtn.setAttribute("aria-label", on ? "Pause music" : "Play music");
}
musicBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().then(() => setPlaying(true)).catch(() => {});
  else { audio.pause(); setPlaying(false); }
});

/* ---- the envelope opening ---- */
const envelope = document.getElementById("envelope");
const content = document.getElementById("content");
let opened = false;

function openCard() {
  if (opened) return;
  opened = true;
  envelope.classList.add("open");
  burst();
  // start the song right here — this runs inside her tap, so the browser allows it.
  // if a song isn't added yet (or autoplay is blocked), it just falls back to the button.
  audio.play()
    .then(() => { setPlaying(true); musicBtn.classList.add("show"); })
    .catch(() => { if (musicReady) musicBtn.classList.add("show"); });
  // reveal content + scroll down to it after the envelope animation
  setTimeout(() => {
    content.classList.add("show");
    content.setAttribute("aria-hidden", "false");
    content.scrollIntoView({ behavior: "smooth", block: "start" });
    if (musicReady) musicBtn.classList.add("show");
  }, 750);
}
envelope.addEventListener("click", openCard);
envelope.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(); } });

/* ---- confetti / heart burst ---- */
function burst() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti");
  const ctx = cv.getContext("2d");
  const DPR = window.devicePixelRatio || 1;
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  ctx.scale(DPR, DPR);
  const colors = ["#9b7bc7", "#c2a8e2", "#c79a52", "#d9c7ee", "#fff"];
  const parts = [];
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (let i = 0; i < 130; i++) {
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
    parts.push({
      x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
      g: 0.12 + Math.random() * 0.1, size: 5 + Math.random() * 7,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
      color: colors[(Math.random() * colors.length) | 0], life: 1,
      heart: Math.random() < 0.4,
    });
  }
  let frames = 0;
  (function anim() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.006;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
      if (p.heart) { ctx.font = p.size * 2 + "px serif"; ctx.fillText("♥", -p.size, p.size); }
      else { ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); }
      ctx.restore();
    });
    frames++;
    if (frames < 220) requestAnimationFrame(anim);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}
</script>
